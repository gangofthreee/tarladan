version: '3.8'

services:
  backend:
    build: .
    container_name: tarladan-backend-dev
    environment:
      #- SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/tarladan
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/tarladan?user=postgres&password=1234
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=1234
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SERVER_PORT=8080
      - JWT_SECRET_KEY=dev_secret_key_sadece_lokal_icin
      - MAIL_USERNAME=kocberra3@gmail.com
      - MAIL_PASSWORD=grnv mpsz qpnb gudw
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db
      - redis
    networks:
      - tarladan-net

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: tarladan
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - tarladan-net

  redis:
    image: redis:7
    networks:
      - tarladan-net

  # Nginx (Dev Ortamı İçin)
  nginx:
    image: nginx:latest
    ports:
      - "81:80"
      - "8443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./certs/fullchain.pem:/etc/ssl/certs/fullchain.pem
      - ./certs/privkey.pem:/etc/ssl/private/privkey.pem
    depends_on:
      - backend
    networks:
      - tarladan-net

volumes:
  postgres_data_dev:

networks:
  tarladan-net: