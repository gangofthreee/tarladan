services:
  backend:
    build:
      context: .
      target: dev
    container_name: tarladan-backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${SPRING_DATASOURCE_DB}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
    volumes:
      - app_uploads:/app/uploads 
      # Maven cache host ile paylaşılır
      - ${M2_PATH}:/root/.m2
      # Kod mount edilir, değişiklik anında yansır
      - ./src:/app/src
      - ./pom.xml:/app/pom.xml
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    container_name: tarladan-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - app_uploads:/app/uploads 

  redis:
    image: redis:7
    container_name: tarladan-redis
    ports:
      - "6379:6379"

  nginx:
    image: nginx:latest
    container_name: tarladan-nginx
    ports:
      - "443:443"  # HTTPS portu
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./certs/fullchain.pem:/etc/ssl/certs/fullchain.pem
      - ./certs/privkey.pem:/etc/ssl/private/privkey.pem
    depends_on:
      - backend

volumes:
  postgres_data:
  app_uploads:
  



