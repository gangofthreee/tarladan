services:
  backend:
    build:
      context: .
      target: dev
    container_name: tarladan-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${SPRING_DATASOURCE_DB}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
    volumes:
      # Maven cache host ile paylaşılır
      - ${M2_PATH}:/root/.m2
      # Kod mount edilir, değişiklik anında yansır
      - ./src:/app/src
      - ./pom.xml:/app/pom.xml
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: tarladan-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:



