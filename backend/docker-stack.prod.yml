services:
  backend:
    # Docker Hub'dan çekecek. Örn: mazlum/tarladan-backend:v1
    image: ${DOCKER_USER}/tarladan-backend:${TAG}
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/tarladan
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SERVER_PORT=8080
      - JWT_SECRET_KEY=${JWT_SECRET}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
    volumes:
      - app_uploads:/app/uploads
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
    networks:
      - tarladan-net

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: tarladan
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    deploy:
      placement:
        constraints: [node.role == manager]
    networks:
      - tarladan-net

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data_prod:/data
    deploy:
      replicas: 1
    networks:
      - tarladan-net

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./certs/fullchain.pem:/etc/ssl/certs/fullchain.pem
      - ./certs/privkey.pem:/etc/ssl/private/privkey.pem
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
    networks:
      - tarladan-net

volumes:
  postgres_data_prod:
  redis_data_prod:
  app_uploads:

networks:
  tarladan-net:
    driver: overlay