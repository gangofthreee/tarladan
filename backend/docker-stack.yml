version: '3.8'

services:
  backend:
    image: tarladan-backend:latest
    environment:
      # ŞİFREYİ DOĞRUDAN URL İÇİNE GÖMÜYORUZ (En garanti yöntem)
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/tarladan?user=postgres&password=1234
      # Spring Boot'un kendi user/pass alanlarını boş bırakıyoruz ki karışmasın
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=1234
      # Redis Ayarları
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SERVER_PORT=8080
    volumes:
      - app_uploads:/app/uploads
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
    networks:
      - tarladan-net

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234  # BURASI ÇOK ÖNEMLİ: Backend şifresiyle aynı!
      POSTGRES_DB: tarladan
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - app_uploads:/app/uploads
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
    networks:
      - tarladan-net

  redis:
    image: redis:7
    deploy:
      replicas: 1
    networks:
      - tarladan-net

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./certs/fullchain.pem:/etc/ssl/certs/fullchain.pem
      - ./certs/privkey.pem:/etc/ssl/private/privkey.pem
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
    networks:
      - tarladan-net

  visualizer:
    image: bretfisher/visualizer
    ports:
      - "8081:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    deploy:
      placement:
        constraints: [node.role == manager]
    networks:
      - tarladan-net

volumes:
  postgres_data:
  app_uploads:

networks:
  tarladan-net:
    driver: overlay