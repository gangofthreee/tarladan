version: '3.8'

services:
  backend:
    image: tarladan-backend:latest # Localde build ettiğin image ismi
    # build, context, target kısımları Swarm'da KULLANILMAZ, silindi.
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${SPRING_DATASOURCE_DB:-tarladan}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-password}
      - SERVER_PORT=8080
    volumes:
      - app_uploads:/app/uploads
      # Kaynak kod (src, pom.xml) mount'ları silindi, image içinde olmalılar.
    deploy:
      replicas: 3 # SUNUMDA BURAYI VURGULA: 3 Backend aynı anda çalışıyor.
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
    depends_on:
      - db
      - redis
    networks:
      - tarladan-net

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-tarladan}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - app_uploads:/app/uploads
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager] # DB verisi tek noktada olsun
    networks:
      - tarladan-net

  redis:
    image: redis:7
    deploy:
      replicas: 1
    networks:
      - tarladan-net

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Config dosyasını dışarıdan veriyoruz
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      # Sertifikaları dışarıdan veriyoruz (Yolların tam olduğuna emin ol)
      - ./certs/fullchain.pem:/etc/ssl/certs/fullchain.pem
      - ./certs/privkey.pem:/etc/ssl/private/privkey.pem
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
    networks:
      - tarladan-net

  # Sunumda HOCAYA GÖSTERMEK İÇİN:
  visualizer:
    image: bretfisher/visualizer
    ports:
      - "8081:8080" # 8081 portunda görselleştirici çalışacak
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    deploy:
      placement:
        constraints: [node.role == manager]
    networks:
      - tarladan-net

volumes:
  postgres_data:
  app_uploads:

networks:
  tarladan-net:
    driver: overlay # SWARM İÇİN BU ZORUNLU