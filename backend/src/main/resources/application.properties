spring.application.name=tarladan

# --- DATABASE ---
# URL, username, and password come from the Docker environment.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false


# --- REDIS ---
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}

# --- MAIL ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# Mail username and password come from the environment.
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# --- LOGGING ---
logging.level.root=INFO
logging.level.org.springframework.security=DEBUG
server.error.include-message=always
server.error.include-binding-errors=always

# --- JWT ---
# Secret key comes from the environment.
jwt.secret-key=${JWT_SECRET_KEY}
jwt.access-token-ttl-minutes=15
jwt.refresh-token-ttl-days=7